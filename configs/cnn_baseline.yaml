project:
  name: lung-xray-classification-cnn
  experiment: cnn_baseline

data:
  raw_dir: data/raw
  processed_dir: data/processed
  img_size: 224
  num_classes: 3
  class_names: ["COVID", "Pneumonia", "Normal"]

split:
  train: 0.7
  val: 0.15
  test: 0.15
  seed: 42

training:
  batch_size: 32
  epochs: 15
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 2
  device: cuda

model:
  name: simple_cnn
